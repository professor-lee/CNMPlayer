[package]
name = "ncm-api"
version = "0.1.0"
edition = "2021"
description = "Netease Cloud Music API Rust SDK"
license = "WTFPL"
repository = "https://github.com/imsyy/ncm-api-rs"
homepage = "https://github.com/imsyy/ncm-api-rs"

[dependencies]
http = "1.4"
cyper = { git = "https://github.com/compio-rs/cyper", default-features = false, features = ["json", "cookies", "stream"] } 
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ecb = { version = "0.2", features = ["alloc"] }
md-5 = "0.11"
rsa = "0.10.0-rc.17"
rand = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
urlencoding = "2"
chrono = "0.4"
regex-lite = "0.1"
