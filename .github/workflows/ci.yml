name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  # 手动运行时 macOS 任务额外上传 release 二进制，供真机测试；不是正式发版产物。
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.toolchain }} / ${{ matrix.feature_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            feature_name: default
            feature_args: ""
          - toolchain: stable
            feature_name: no-default-features
            feature_args: --no-default-features
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libchafa-dev libpipewire-0.3-dev libssl-dev libglib2.0-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --locked --all-targets
        env:
          FEATURE_ARGS: ${{ matrix.feature_args }}
        run: cargo check --workspace --locked --all-targets $FEATURE_ARGS

      - name: cargo test --locked --all-targets
        env:
          FEATURE_ARGS: ${{ matrix.feature_args }}
        run: cargo test --workspace --locked --all-targets $FEATURE_ARGS

  quality:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libchafa-dev libpipewire-0.3-dev libssl-dev libglib2.0-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo clippy --all-targets --no-default-features
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  macos:
    # Apple 芯片与 Intel 各一台：clippy 覆盖 macos/ 补丁目录，测试跑在真实的 macOS 上。
    # 自动触发时只做检查与测试；手动运行（workflow_dispatch）时另外打包测试用二进制。
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          # GitHub 最后一个 x86_64 macOS 镜像，预计 2027 年 8 月下线，届时删掉这一项。
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy --all-targets --all-features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo clippy --all-targets --no-default-features
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: cargo test --locked --all-targets
        run: cargo test --workspace --locked --all-targets

      - name: cargo test --locked --all-targets --no-default-features
        run: cargo test --workspace --locked --all-targets --no-default-features

      # 检查或测试失败也照样打包，方便直接在真机上排查。
      - name: Build test binary (manual runs only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          cargo build --locked --release
          # 链接后 strip 过的二进制重新做 ad-hoc 签名，Apple 芯片上未签名的可执行文件会被直接杀掉。
          codesign --force --sign - target/release/cnmplayer
          codesign --verify --verbose target/release/cnmplayer
          file target/release/cnmplayer
          otool -L target/release/cnmplayer
          name="CNMPlayer_${GITHUB_SHA::7}_macos_${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/cnmplayer LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          # 打成 tar 保留可执行权限（Actions 的 zip 制品会丢掉权限位）。
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz"
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload test binary (manual runs only)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && env.ARCHIVE != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cnmplayer-macos-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 14

  aur-packaging:
    name: AUR packaging integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging check dependencies
        run: |
          pacman -Syu --noconfirm --needed git python
          useradd -m builder

      - name: Exercise packaging with isolated local remotes
        run: sudo -u builder -H python "$GITHUB_WORKSPACE/.github/scripts/test_aur_sync.py"
