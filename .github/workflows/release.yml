name: Release

# push tag v* → 双架构构建 → GitHub Release → AUR 同步 → 回合并 PR。
# GITHUB_TOKEN 发布的 release 事件不会触发其他 workflow，AUR 因此保持链式 job。
# 回合并使用独立 GitHub App，让 PR CI 与合并后的 develop push 正常触发。
# workflow_dispatch 用于空跑演练（默认只构建不发布）或手动补同步 AUR（sync_aur=true）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.6.0'
        required: true
      sync_aur:
        description: 'Also sync AUR (release must already exist; NOT a dry run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify tag/version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Tag must match Cargo.toml version
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          WANT_VER="${TAG#v}"
          HAVE_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$WANT_VER" != "$HAVE_VER" ]; then
            echo "::error::tag version $WANT_VER != Cargo.toml version $HAVE_VER"
            exit 1
          fi

      - name: Record released commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    # 用产物架构名（amd64/aarch64）而非 Rust 三元组：与 tarball 名一致，也更短
    name: Build ${{ matrix.arch }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libchafa-dev libpipewire-0.3-dev libssl-dev libglib2.0-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # 平铺可执行文件及项目/第三方许可声明（无顶层目录）
      - name: Package
        run: |
          mkdir pkg
          cp "target/${{ matrix.target }}/release/cnmplayer" pkg/
          cp LICENSE THIRD_PARTY_NOTICES.md pkg/
          (cd pkg && tar -cJf "../CNMPlayer_${TAG}_linux_${ARCH}.tar.xz" cnmplayer LICENSE THIRD_PARTY_NOTICES.md)

      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.arch }}
          path: CNMPlayer_${{ needs.guard.outputs.tag }}_linux_${{ matrix.arch }}.tar.xz
          if-no-files-found: error

  gate:
    name: Release gate
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libchafa-dev libpipewire-0.3-dev libssl-dev libglib2.0-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Test workspace default features
        run: cargo test --workspace --locked --all-targets

      - name: Test workspace without default features
        run: cargo test --workspace --locked --all-targets --no-default-features

      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.xz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [guard, build, gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh release create --verify-tag 需要 git 仓库上下文来校验 tag，
      # 缺了 checkout 会以 "fatal: not a git repository" 失败。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}

      # 下到子目录：避免 ./*.tar.xz 把仓库自身文件也匹配进去
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: dist

      # create 已存在时回退为 upload，保证 re-run 幂等
      - name: Create release with tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes dist/*.tar.xz dist/SHA256SUMS \
            || gh release upload "$TAG" --clobber dist/*.tar.xz dist/SHA256SUMS

  aur:
    name: Sync AUR packages
    needs: [guard, build, gate, publish]
    # push：随发布自动同步；dispatch+sync_aur：手动补同步（此时 publish 被跳过）
    if: ${{ always() && !cancelled() && needs.gate.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.sync_aur == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Prepare AUR publishing environment
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: bash .github/scripts/aur_setup.sh

      - name: Run AUR sync as builder
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: sudo -u builder -H bash "$GITHUB_WORKSPACE/.github/scripts/aur_sync.sh" release "$TAG" false

  backmerge:
    name: Backmerge released main into develop
    needs: [guard, build, gate, publish, aur]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-backmerge-develop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - name: Require dedicated App credentials
        env:
          APP_ID: ${{ vars.RELEASE_BACKMERGE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_BACKMERGE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure RELEASE_BACKMERGE_APP_ID and RELEASE_BACKMERGE_APP_PRIVATE_KEY for the dedicated repository App."
            exit 1
          fi

      - name: Create repository-scoped App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BACKMERGE_APP_ID }}
          private-key: ${{ secrets.RELEASE_BACKMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create or reuse pinned backmerge PR and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
          RELEASE_SHA: ${{ needs.guard.outputs.sha }}
        run: python3 .github/scripts/release_backmerge.py
